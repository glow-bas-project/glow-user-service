include:
  - project: "backend-architecture-and-scalability/glow-devops"
    ref: "ci/v1.0.12"
    file: "/.gitlab/ci/entry/service-pipeline.yml"

stages:
  - build
  - test
  - publish
  - release

publish:
  stage: publish
  image: eclipse-temurin:25-jdk
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew publish --no-daemon --stacktrace
  needs:
    - job: build_main
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
