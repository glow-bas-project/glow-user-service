# HTTP
quarkus.http.port=8081 
    # The user service will run on port 8081, while the Keycloak server runs on 8080

# OIDC / Keycloak
quarkus.oidc.auth-server-url=http://localhost:8080/realms/glow-realm
quarkus.oidc.client-id=glow-user-service
quarkus.oidc.credentials.secret=<paste-the-client-secret-from-keycloak-here>
    # The client secret can be found in the Keycloak admin console under:
    # glow-realm > Clients > glow-user-service > Credentials -> Client Secret
quarkus.oidc.tls.verification=none

# Datasource – H2 in-memory (temporary)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=glow
quarkus.datasource.password=glow
quarkus.datasource.jdbc.url=jdbc:h2:mem:userservicedb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true