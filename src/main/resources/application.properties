# Application defaults only. Runtime URLs, credentials, and secrets come from
# environment variables (glow-devops compose/.env or Kubernetes), not this file.

quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql

quarkus.http.cors=true
quarkus.http.cors.headers=Accept,Authorization,Content-Type
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog.sql
