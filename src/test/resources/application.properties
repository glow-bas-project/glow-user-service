# Test profile: Dev Services (Docker) for PostgreSQL; OIDC via Keycloak Dev Services
%test.quarkus.kubernetes-config.enabled=false
%test.quarkus.otel.sdk.disabled=true

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true

%test.quarkus.kafka.devservices.enabled=false

%test.quarkus.hibernate-orm.mapping.format.global=ignore
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/changelog/db.changelog.sql
%test.quarkus.hibernate-orm.schema-management.strategy=none
